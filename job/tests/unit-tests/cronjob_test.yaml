suite: CronJob conditional rendering
templates:
  - templates/CronJob.yaml
tests:
  - it: renders a CronJob when kind is CronJob
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob

  - it: is absent when kind is Job
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: Job
    asserts:
      - hasDocuments:
          count: 0

  - it: suspend is true and startingDeadlineSeconds is 5 when activeCronCluster is false
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      # top-level disableActiveClusterCheck wins over global, override here too (see CronJob.yaml)
      disableActiveClusterCheck: false
      global:
        activeCronCluster: false
        disableActiveClusterCheck: false
    asserts:
      - equal:
          path: spec.suspend
          value: true
      - equal:
          path: spec.startingDeadlineSeconds
          value: 5

  - it: suspend is false and startingDeadlineSeconds uses value when activeCronCluster is true
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: false
      global:
        activeCronCluster: true
        disableActiveClusterCheck: false
    asserts:
      - equal:
          path: spec.suspend
          value: false
      - equal:
          path: spec.startingDeadlineSeconds
          value: 1200

  - it: suspend forced to true with startingDeadlineSeconds 5 when suspend value set and disableActiveClusterCheck false
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      suspend: true
      disableActiveClusterCheck: false
      global:
        activeCronCluster: true
        disableActiveClusterCheck: false
    asserts:
      - equal:
          path: spec.suspend
          value: true
      - equal:
          path: spec.startingDeadlineSeconds
          value: 5

  - it: suspend and startingDeadlineSeconds taken directly from values when disableActiveClusterCheck is true
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 900
      suspend: false
      disableActiveClusterCheck: true
    asserts:
      - equal:
          path: spec.suspend
          value: false
      - equal:
          path: spec.startingDeadlineSeconds
          value: 900

  - it: concurrencyPolicy is rendered when set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
      concurrencyPolicy: Forbid
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: concurrencyPolicy is absent when not set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
      # defaults to "Forbid" in values.yaml, must be cleared to hit the absent branch
      concurrencyPolicy: null
    asserts:
      - notExists:
          path: spec.concurrencyPolicy

  - it: successfulJobsHistoryLimit is rendered when set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
      successfulJobsHistoryLimit: 3
    asserts:
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 3

  - it: successfulJobsHistoryLimit is absent when not set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
    asserts:
      - notExists:
          path: spec.successfulJobsHistoryLimit

  - it: failedJobsHistoryLimit is rendered when set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
      failedJobsHistoryLimit: 2
    asserts:
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 2

  - it: failedJobsHistoryLimit is absent when not set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
    asserts:
      - notExists:
          path: spec.failedJobsHistoryLimit

  - it: disableActiveClusterCheck falls back to global value when not set locally
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: CronJob
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 900
      suspend: false
      # unset top-level (defaults true in ci-values-minimal.yaml) to genuinely test the fallback
      disableActiveClusterCheck: null
      global:
        disableActiveClusterCheck: true
    asserts:
      - equal:
          path: spec.suspend
          value: false
      - equal:
          path: spec.startingDeadlineSeconds
          value: 900

  - it: language values override kind to CronJob while unrelated top-level values still apply
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      kind: Job
      schedule: "*/5 * * * *"
      startingDeadlineSeconds: 1200
      disableActiveClusterCheck: true
      suspend: false
      language: java
      java:
        kind: CronJob
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.schedule
          value: "*/5 * * * *"
